[package]
name = "pryty-rustbrowser"
version = "0.1.1"
edition = "2024"
description = "One-line browser API hooks for Rust Front-end development"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "web", "browser", "hooks"]

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaTrackConstraints",
    "MediaRecorder",
    "MediaRecorderOptions",
    "Blob",
    "BlobEvent",
    "Event",
    "Clipboard",
    "Storage",
    "Geolocation"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
dioxus = { version = "0.7", features = ["web", "desktop"] }